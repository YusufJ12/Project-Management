name: Deploy Laravel to Shared Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, zip, intl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Sanitize Deployment Variables
        run: |
          CLEAN_HOST=$(echo "${{ secrets.SSH_HOST }}" | awk '{print $1}' | tr -d ' \t\r\n')
          CLEAN_USER=$(echo "${{ secrets.SSH_USER }}" | awk '{print $1}' | tr -d ' \t\r\n')
          CLEAN_PORT=$(echo "${{ secrets.SSH_PORT }}" | tr -dc '0-9')
          CLEAN_TARGET=$(echo "${{ secrets.REMOTE_TARGET }}" | awk '{print $1}' | tr -d ' \t\r\n')

          if [ -z "$CLEAN_PORT" ]; then
            CLEAN_PORT="64000"
          fi

          echo "CLEAN_HOST=$CLEAN_HOST" >> $GITHUB_ENV
          echo "CLEAN_USER=$CLEAN_USER" >> $GITHUB_ENV
          echo "CLEAN_PORT=$CLEAN_PORT" >> $GITHUB_ENV
          echo "CLEAN_TARGET=$CLEAN_TARGET" >> $GITHUB_ENV

      - name: Write Firebase Service Account if Secret Exists
        if: env.HAS_FCM_SECRET != ''
        run: |
          mkdir -p storage/app/firebase
          echo "$HAS_FCM_SECRET" > storage/app/firebase/service-account.json
        env:
          HAS_FCM_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy via Rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ env.CLEAN_HOST }}
          REMOTE_USER: ${{ env.CLEAN_USER }}
          REMOTE_PORT: ${{ env.CLEAN_PORT }}
          TARGET: ${{ env.CLEAN_TARGET }}
          EXCLUDE: "/.git/, /.github/, /node_modules/, /.env, /storage/logs/, /storage/framework/sessions/, /storage/app/public/, /storage/app/firebase/, /public/storage"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ env.CLEAN_HOST }}
          REMOTE_USER: ${{ env.CLEAN_USER }}
          REMOTE_PORT: ${{ env.CLEAN_PORT }}
          TARGET: ${{ env.CLEAN_TARGET }}
          EXCLUDE: "/.git/, /.github/, /node_modules/, /.env, /storage/logs/, /storage/framework/sessions/, /storage/app/public/, /storage/app/firebase/, /public/storage"

      - name: Run Post-Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.CLEAN_HOST }}
          username: ${{ env.CLEAN_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.CLEAN_PORT }}
          script: |
            cd ${{ env.CLEAN_TARGET }}
            /opt/alt/php83/usr/bin/php artisan storage:link || true
            /opt/alt/php83/usr/bin/php artisan migrate --force
            /opt/alt/php83/usr/bin/php artisan optimize:clear
            /opt/alt/php83/usr/bin/php artisan optimize
